<text x="810" y="334" text-anchor="middle" font-size="18" font-weight="700" fill="#244867">MariaDB</text>
<text x="810" y="359" text-anchor="middle" font-size="16" font-weight="400" fill="#52677d">작업 데이터 저장과 조회</text>
<rect x="40" y="490" width="260" height="90" rx="12" fill="#ffffff" stroke="#bacbdc" stroke-width="1.5"/>
<text x="170" y="524" text-anchor="middle" font-size="18" font-weight="700" fill="#244867">Pod A SSE 연결</text>
<text x="170" y="549" text-anchor="middle" font-size="16" font-weight="400" fill="#52677d">연결된 사용자에게 알림</text>
<rect x="360" y="490" width="260" height="90" rx="12" fill="#e5effa" stroke="#6293c0" stroke-width="1.5"/>
<text x="490" y="524" text-anchor="middle" font-size="18" font-weight="700" fill="#244867">Redis Pub/Sub</text>
<text x="490" y="549" text-anchor="middle" font-size="16" font-weight="400" fill="#52677d">각 Pod에 결과 알림 전달</text>
<rect x="680" y="490" width="260" height="90" rx="12" fill="#ffffff" stroke="#bacbdc" stroke-width="1.5"/>
<text x="810" y="524" text-anchor="middle" font-size="18" font-weight="700" fill="#244867">Pod B SSE 연결</text>
<text x="810" y="549" text-anchor="middle" font-size="16" font-weight="400" fill="#52677d">연결된 사용자에게 알림</text>
