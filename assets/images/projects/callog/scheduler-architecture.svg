<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 640" role="img" aria-labelledby="title desc">
<title id="title">다중 Pod 작업 실행과 알림</title><desc id="desc">실행 경쟁은 공유 락으로 제어하고 결과는 각 Pod의 사용자에게 전달</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#6b8199"/></marker></defs>
<rect width="980" height="640" rx="18" fill="#f5f8fc"/>
<g font-family="Pretendard, Malgun Gothic, sans-serif">
<text x="40" y="45" font-size="24" font-weight="700" fill="#203b56">다중 Pod 작업 실행과 알림</text>
<text x="40" y="75" font-size="16" fill="#546a80">실행 경쟁은 공유 락으로 제어하고 결과는 각 Pod의 사용자에게 전달</text>
<path d="M300 155 L360 155" fill="none" stroke="#6b8199" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M680 155 L620 155" fill="none" stroke="#6b8199" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M490 200 L490 300" fill="none" stroke="#6b8199" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="448.0" y="239" width="84" height="23" rx="4" fill="#f5f8fc"/><text x="490" y="255" text-anchor="middle" font-size="15" fill="#52677d">획득 성공</text>
<path d="M360 345 L330 345 L330 245 L395 245 L395 200" fill="none" stroke="#6b8199" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="192.5" y="272" width="145" height="23" rx="4" fill="#f5f8fc"/><text x="265" y="288" text-anchor="middle" font-size="15" fill="#52677d">토큰 확인 후 해제</text>
<path d="M620 345 L680 345" fill="none" stroke="#6b8199" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<path d="M490 390 L490 490" fill="none" stroke="#6b8199" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="448.0" y="431" width="84" height="23" rx="4" fill="#f5f8fc"/><text x="490" y="447" text-anchor="middle" font-size="15" fill="#52677d">결과 발행</text>
<path d="M360 535 L300 535" fill="none" stroke="#6b8199" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M620 535 L680 535" fill="none" stroke="#6b8199" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="110" width="260" height="90" rx="12" fill="#ffffff" stroke="#bacbdc" stroke-width="1.5"/>
<text x="170" y="144" text-anchor="middle" font-size="18" font-weight="700" fill="#244867">Pod A 스케줄러</text>
<text x="170" y="169" text-anchor="middle" font-size="16" font-weight="400" fill="#52677d">공유 락 획득 시도</text>
<rect x="360" y="110" width="260" height="90" rx="12" fill="#e5effa" stroke="#6293c0" stroke-width="1.5"/>
<text x="490" y="144" text-anchor="middle" font-size="18" font-weight="700" fill="#244867">Redis 공유 락</text>
<text x="490" y="169" text-anchor="middle" font-size="16" font-weight="400" fill="#52677d">작업 키 / UUID / TTL</text>
<rect x="680" y="110" width="260" height="90" rx="12" fill="#ffffff" stroke="#bacbdc" stroke-width="1.5"/>
<text x="810" y="144" text-anchor="middle" font-size="18" font-weight="700" fill="#244867">Pod B 스케줄러</text>
<text x="810" y="169" text-anchor="middle" font-size="16" font-weight="400" fill="#52677d">공유 락 획득 시도</text>
<rect x="360" y="300" width="260" height="90" rx="12" fill="#e5effa" stroke="#6293c0" stroke-width="1.5"/>
<text x="490" y="334" text-anchor="middle" font-size="18" font-weight="700" fill="#244867">락을 획득한 실행</text>
<text x="490" y="359" text-anchor="middle" font-size="16" font-weight="400" fill="#52677d">스냅샷 / 마감 알림 작업</text>
