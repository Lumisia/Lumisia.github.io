<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 640" role="img" aria-labelledby="title desc">
<title id="title">캘린더 일정 조회와 표시</title><desc id="desc">기간을 주차별 구간으로 나누고 겹치는 일정은 서로 다른 줄에 배치</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#6b8199"/></marker></defs>
<rect width="980" height="640" rx="18" fill="#f5f8fc"/>
<g font-family="Pretendard, Malgun Gothic, sans-serif">
<text x="40" y="45" font-size="24" font-weight="700" fill="#203b56">캘린더 일정 조회와 표시</text>
<text x="40" y="75" font-size="16" fill="#546a80">기간을 주차별 구간으로 나누고 겹치는 일정은 서로 다른 줄에 배치</text>
<path d="M300 155 L360 155" fill="none" stroke="#6b8199" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M620 155 L680 155" fill="none" stroke="#6b8199" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<path d="M490 200 L490 250 L810 250 L810 300" fill="none" stroke="#6b8199" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="611.0" y="224" width="78" height="23" rx="4" fill="#f5f8fc"/><text x="650" y="240" text-anchor="middle" font-size="15" fill="#52677d">API 응답</text>
<path d="M680 345 L620 345" fill="none" stroke="#6b8199" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M360 345 L300 345" fill="none" stroke="#6b8199" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M170 390 L170 490" fill="none" stroke="#6b8199" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M300 535 L360 535" fill="none" stroke="#6b8199" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="307.0" y="505" width="46" height="23" rx="4" fill="#f5f8fc"/><text x="330" y="521" text-anchor="middle" font-size="15" fill="#52677d">초과</text>
<path d="M620 535 L680 535" fill="none" stroke="#6b8199" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="110" width="260" height="90" rx="12" fill="#ffffff" stroke="#bacbdc" stroke-width="1.5"/>
<text x="170" y="144" text-anchor="middle" font-size="18" font-weight="700" fill="#244867">캘린더 화면</text>
<text x="170" y="169" text-anchor="middle" font-size="16" font-weight="400" fill="#52677d">일정 조회 요청</text>
<rect x="360" y="110" width="260" height="90" rx="12" fill="#ffffff" stroke="#bacbdc" stroke-width="1.5"/>
<text x="490" y="144" text-anchor="middle" font-size="18" font-weight="700" fill="#244867">캘린더 API</text>
<text x="490" y="169" text-anchor="middle" font-size="16" font-weight="400" fill="#52677d">캠페인과 마일스톤 등 조회</text>
<rect x="680" y="110" width="260" height="90" rx="12" fill="#ffffff" stroke="#bacbdc" stroke-width="1.5"/>
<text x="810" y="144" text-anchor="middle" font-size="18" font-weight="700" fill="#244867">MariaDB</text>
<text x="810" y="169" text-anchor="middle" font-size="16" font-weight="400" fill="#52677d">일정 원본 데이터</text>
<rect x="680" y="300" width="260" height="90" rx="12" fill="#ffffff" stroke="#bacbdc" stroke-width="1.5"/>
<text x="810" y="334" text-anchor="middle" font-size="18" font-weight="700" fill="#244867">일정 형식 정리</text>
<text x="810" y="359" text-anchor="middle" font-size="16" font-weight="400" fill="#52677d">시작일과 종료일 통일</text>
<rect x="360" y="300" width="260" height="90" rx="12" fill="#e5effa" stroke="#6293c0" stroke-width="1.5"/>
<text x="490" y="334" text-anchor="middle" font-size="18" font-weight="700" fill="#244867">주차별 표시 구간</text>
<text x="490" y="359" text-anchor="middle" font-size="16" font-weight="400" fill="#52677d">startCol / endCol 계산</text>
<rect x="40" y="300" width="260" height="90" rx="12" fill="#e5effa" stroke="#6293c0" stroke-width="1.5"/>
<text x="170" y="334" text-anchor="middle" font-size="18" font-weight="700" fill="#244867">겹침 판정과 줄 배정</text>
<text x="170" y="359" text-anchor="middle" font-size="16" font-weight="400" fill="#52677d">같은 구간은 다른 줄에 배치</text>
<rect x="40" y="490" width="260" height="90" rx="12" fill="#e5effa" stroke="#6293c0" stroke-width="1.5"/>
<text x="170" y="524" text-anchor="middle" font-size="18" font-weight="700" fill="#244867">최대 4줄의 기간 막대</text>
<text x="170" y="549" text-anchor="middle" font-size="16" font-weight="400" fill="#52677d">기간의 연속성 표시</text>
<rect x="360" y="490" width="260" height="90" rx="12" fill="#e5effa" stroke="#6293c0" stroke-width="1.5"/>
<text x="490" y="524" text-anchor="middle" font-size="18" font-weight="700" fill="#244867">날짜별 +N</text>
<text x="490" y="549" text-anchor="middle" font-size="16" font-weight="400" fill="#52677d">표시 한도를 넘은 일정</text>
<rect x="680" y="490" width="260" height="90" rx="12" fill="#ffffff" stroke="#bacbdc" stroke-width="1.5"/>
<text x="810" y="524" text-anchor="middle" font-size="18" font-weight="700" fill="#244867">전체 일정과 상세 보기</text>
<text x="810" y="549" text-anchor="middle" font-size="16" font-weight="400" fill="#52677d">숨겨진 일정까지 확인</text>
</g></svg>
